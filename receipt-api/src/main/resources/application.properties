spring.application.name=receipt-api
server.port=8080
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
receipt.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
receipt.redis.enabled=${REDIS_ENABLED:false}
receipt.redis.host=${REDIS_HOST:}
receipt.redis.port=${REDIS_PORT:10000}
receipt.redis.password=${REDIS_PASSWORD:}
applicationinsights.connection.string=${APPLICATIONINSIGHTS_CONNECTION_STRING:}
